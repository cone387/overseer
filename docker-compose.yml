services:
  overseer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9721:9721"
    volumes:
      - ./config.yaml:/etc/overseer/config.yaml:ro
      - ./data:/data
    environment:
      - OVERSEER_CONFIG_PATH=/etc/overseer/config.yaml
      - TZ=Asia/Shanghai
    restart: unless-stopped
