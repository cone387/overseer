# =============================================================================
# Overseer 配置文件示例
# 基于 Bark 的个人定制推送系统 —— "听声辨事"
# =============================================================================

# -----------------------------------------------------------------------------
# 服务器配置
# -----------------------------------------------------------------------------
server:
  # HTTP 服务监听端口，取值范围 1~65535
  port: 9721
  # API 认证密钥，长度至少 16 个字符，所有 API 请求需在 X-API-Key Header 中携带此密钥
  api_key: "your-secure-api-key-here-min-16-chars"

# -----------------------------------------------------------------------------
# Bark 推送服务配置
# -----------------------------------------------------------------------------
bark:
  # Bark 服务器地址（必填），可使用官方服务或自建服务
  server_url: "https://api.day.app"
  # 单次推送请求超时时间（秒），包含连接建立和响应读取
  timeout: 10
  # 推送失败后最大重试次数，按指数退避策略重试（1s、2s、4s）
  max_retries: 3
  # 注意：设备 Key 不再在此配置，请在 Web 管理界面的"设备管理"中添加设备

# -----------------------------------------------------------------------------
# 桌面客户端配置
# -----------------------------------------------------------------------------
desktop:
  # 注册令牌，桌面客户端自注册时需要提供此令牌
  # 留空则禁用桌面客户端注册功能
  register_token: "overseer-test-token"
  # 最大桌面设备数量限制，0 表示不限制
  max_devices: 5

# -----------------------------------------------------------------------------
# 频道定义
# 每个频道绑定独特的声音、分组和优先级，实现"听声辨事"
# 优先级说明：
#   - active: 普通通知（默认）
#   - timeSensitive: 时效性通知，可突破系统专注模式
#   - passive: 静默通知，不发出声音和震动
#   - critical: 紧急通知，即使静音也会发出声音
# -----------------------------------------------------------------------------
channels:
  # 紧急频道 - 用于需要立即关注的重要消息
  - name: urgent
    sound: "alarm.caf"
    group: "紧急"
    level: critical

  # GitHub 频道 - 用于代码仓库相关通知
  - name: github
    sound: "glass.caf"
    group: "开发"
    icon: "https://github.githubassets.com/favicons/favicon.svg"
    level: active

  # 监控频道 - 用于服务器和应用监控告警
  - name: monitor
    sound: "beacon.caf"
    group: "监控"
    level: timeSensitive

  # 默认频道 - 未匹配任何规则的消息将路由到此频道
  - name: default
    sound: ""
    group: "default"
    level: active

# -----------------------------------------------------------------------------
# 路由规则
# 按定义顺序从上到下依次匹配，命中第一条规则后停止匹配
# 匹配条件：
#   - source: 精确匹配消息来源
#   - content: 正则表达式匹配消息内容（body 字段）
#   - 同时定义 source 和 content 时，两者必须同时满足（AND 逻辑）
# -----------------------------------------------------------------------------
rules:
  # GitHub CI 失败 - 同时匹配来源和内容关键词，路由到紧急频道
  - name: github-ci-fail
    source: github
    content: "failed|error"
    channel: urgent
    template: github_alert

  # GitHub 通用事件 - 仅匹配来源
  - name: github-events
    source: github
    channel: github
    template: github_event

  # Grafana 监控告警
  - name: grafana-alerts
    source: grafana
    channel: monitor

# -----------------------------------------------------------------------------
# 消息模板
# 使用 Go template 语法格式化推送内容
# 可用变量：.source, .title, .body, .timestamp, .extra（键值对 map）
# -----------------------------------------------------------------------------
templates:
  - name: github_alert
    content: "🚨 {{.source}}: {{.title}}"
  - name: github_event
    content: "📦 {{.title}}\n{{.body}}"

# -----------------------------------------------------------------------------
# 免打扰时段配置
# 在指定时间段内，非紧急消息将被暂存，时段结束后按接收顺序逐条推送
# 时间格式：HH:MM（24小时制）
# 生效日期：everyday（每天）、weekday（工作日）、weekend（周末）
# 当开始时间 > 结束时间时，视为跨午夜时段（如 23:00-07:30）
# -----------------------------------------------------------------------------
dnd: []

# -----------------------------------------------------------------------------
# 消息聚合器配置
# 用于去重、批量合并和频率限制，防止消息轰炸
# -----------------------------------------------------------------------------
aggregator:
  # 去重时间窗口（秒），同一频道内相同内容的消息在此窗口内仅推送一次
  dedupe_window: 300
  # 批量合并阈值，同一频道在时间窗口内超过此数量的不同消息将被合并为摘要
  batch_threshold: 10
  # 频率限制时间窗口（秒）
  rate_window: 3600
  # 频率限制上限，单个频道在时间窗口内最多推送此数量的消息
  rate_limit: 30
  # 暂存消息上限，超过此数量将合并为摘要推送并清空队列
  max_pending: 100

# -----------------------------------------------------------------------------
# 消息升级配置
# 对未确认的重要消息自动升级推送方式，确保关键信息不被遗漏
# -----------------------------------------------------------------------------
escalation:
  # 是否启用消息升级功能
  enabled: true
  # 等待确认时间（分钟），超时未确认则触发升级，范围 1~60
  wait_minutes: 5
  # 最大升级次数，达到上限后停止升级并执行最终推送，范围 1~10
  max_escalations: 3
  # 升级间隔策略：fixed（固定间隔）或 increasing（递增间隔）
  interval: increasing
  # 升级间隔时间（分钟），范围 1~120
  interval_minutes: 5
